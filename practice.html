<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-v2.png">

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#315f65"
  >

  <title>團練｜Surf Club</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >
</head>

<body class="leaderboard-body">
  <header class="site-header">
    <div class="site-header-inner">
      <a
        class="site-brand"
        href="./member.html"
      >
        <span class="site-brand-mark">
          SC
        </span>

        <span class="site-brand-text">
          <strong>Surf Club</strong>
          <small>社員資訊系統</small>
        </span>
      </a>

      <nav class="site-nav">
        <a href="./member.html">
          社員首頁
        </a>

        <a href="./dex.html">
          社員圖鑑
        </a>

        <a href="./memories.html">
          回憶牆
        </a>

        <a
          class="active"
          href="./practice.html"
        >
          團練
        </a>

        <a href="./courses.html">
          社課資訊
        </a>

        <a href="./leaderboard.html">
          排行榜
        </a>

        <button
          id="logoutButton"
          class="site-nav-logout"
          type="button"
        >
          登出
        </button>
      </nav>
    </div>
  </header>

  <main class="leaderboard-page">
    <section class="dex-hero practice-hero">
      <p class="leaderboard-eyebrow">
        GROUP PRACTICE
      </p>

      <h1>
        團練
      </h1>

      <p class="leaderboard-description">
        幹部開好的團練都在這裡，按「我要參加」報名，人數到了幹部會確認成團。
      </p>
    </section>

    <p
      id="practiceStatus"
      class="status-message"
    >
      正在載入團練……
    </p>

    <section class="boards-section">
      <div class="leaderboard-section-header">
        <div>
          <p class="leaderboard-section-eyebrow">
            UPCOMING
          </p>

          <h2>
            接下來的團練
          </h2>
        </div>
      </div>

      <div
        id="practiceList"
        class="practice-list"
      ></div>
    </section>

    <details
      id="pastPractices"
      class="growth-details past-practices"
    >
      <summary>
        已結束或取消的團練
      </summary>

      <div
        id="pastPracticeList"
        class="practice-list"
      ></div>
    </details>
  </main>

  <script
    type="module"
    src="./js/practice.js"
  ></script>
</body>
</html>
