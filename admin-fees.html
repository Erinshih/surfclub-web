
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-v2.png">
  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <title>Surf Club Admin｜費用管理</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >
</head>

<body>
  <header class="site-header">
    <nav class="navbar">
      <a
        class="brand"
        href="./admin.html"
      >
        SURF CLUB ADMIN
      </a>

      <div class="nav-links">
        <a href="./admin.html">
          管理首頁
        </a>

        <a href="./admin-announcements.html">
          公告管理
        </a>

        <a href="./admin-courses.html">
          社課管理
        </a>

        <a href="./admin-members.html">
          社員管理
        </a>

        <a href="./admin-trips.html">
          出團紀錄
        </a>

        <a href="./admin-fees.html">
          費用管理
        </a>

        <a href="./leaderboard.html">
          排行榜
        </a>

        <a href="./admin-settle.html">
          排行榜管理
        </a>

        <!-- <a href="./index.html">
          公開網站
        </a> -->

        <button
          id="logout-button"
          class="button button-small button-secondary"
          type="button"
        >
          登出
        </button>
      </div>
    </nav>
  </header>

  <main class="dashboard">
    <section class="dashboard-header">
      <div>
        <p class="eyebrow">
          FEES
        </p>

        <h1>
          費用管理
        </h1>
      </div>

      <p
        id="admin-status"
        class="status-message"
      >
        正在驗證管理員身分……
      </p>
    </section>

    <div
      id="admin-content"
      class="hidden"
    >
      <!-- ===============================================
           總覽
           =============================================== -->

      <section
        id="fee-summary"
        class="dashboard-stats"
        aria-label="收款總覽"
      ></section>

      <!-- ===============================================
           新增費用
           =============================================== -->

      <section class="content-card">
        <h2>
          新增費用
        </h2>

        <p class="panel-hint">
          例如車資、社服、宵夜。建立後，被選到的社員會在社員首頁看到「我的待繳」。
        </p>

        <form id="charge-form">
          <div class="form-grid">
            <div class="field-stack">
              <label for="charge-title">
                名稱 *
              </label>

              <input
                id="charge-title"
                type="text"
                maxlength="40"
                placeholder="例如：10/18 漁光島團 車資"
                required
              >
            </div>

            <div class="field-stack">
              <label for="charge-amount">
                每人金額 *
              </label>

              <input
                id="charge-amount"
                type="number"
                min="1"
                max="100000"
                step="1"
                inputmode="numeric"
                placeholder="300"
                required
              >
            </div>
          </div>

          <div class="form-grid">
            <div class="field-stack">
              <label for="charge-due">
                繳費期限（選填）
              </label>

              <input
                id="charge-due"
                type="date"
              >
            </div>

            <div class="field-stack">
              <label for="charge-trip">
                套用出團名單（選填）
              </label>

              <select id="charge-trip">
                <option value="">
                  不套用
                </option>
              </select>
            </div>
          </div>

          <label for="charge-note">
            轉帳資訊或備註（社員看得到）
          </label>

          <textarea
            id="charge-note"
            class="charge-note"
            maxlength="300"
            placeholder="例如：轉帳到 中華郵政 700 帳號 0001234-5678901，備註姓名"
          ></textarea>

          <label>
            要繳費的社員（<span id="charge-count">0</span> 人）
          </label>

          <div class="participant-tools">
            <input
              id="charge-search"
              type="search"
              placeholder="搜尋名字或綽號"
              aria-label="搜尋社員"
            >

            <button
              id="charge-select-all"
              class="button button-small button-secondary"
              type="button"
            >
              全選正式社員
            </button>

            <button
              id="charge-clear"
              class="button button-small button-secondary"
              type="button"
            >
              全部取消
            </button>
          </div>

          <div
            id="charge-members"
            class="participant-picker"
          ></div>

          <p
            id="charge-message"
            class="status-message"
          ></p>

          <div class="dialog-actions">
            <button
              id="charge-button"
              class="button"
              type="submit"
            >
              建立費用
            </button>
          </div>
        </form>
      </section>

      <!-- ===============================================
           費用列表
           =============================================== -->

      <section class="content-card">
        <div class="fee-list-header">
          <h2>
            所有費用
          </h2>

          <label class="check-item fee-filter">
            <input
              id="fee-filter-open"
              type="checkbox"
              checked
            >
            <span>只顯示還有人沒繳清的</span>
          </label>
        </div>

        <p
          id="fee-list-message"
          class="status-message"
        ></p>

        <div
          id="fee-list"
          class="fee-list"
        >
          <p class="empty-state">
            正在載入……
          </p>
        </div>
      </section>
    </div>
  </main>

  <script
    type="module"
    src="./js/admin-fees.js"
  ></script>
</body>
</html>
