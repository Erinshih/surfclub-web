<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-v2.png">

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#315f65"
  >

  <title>回憶牆｜Surf Club</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >
</head>

<body class="leaderboard-body">
  <header class="site-header">
    <div class="site-header-inner">
      <a
        class="site-brand"
        href="./member.html"
      >
        <span class="site-brand-mark">
          SC
        </span>

        <span class="site-brand-text">
          <strong>Surf Club</strong>
          <small>社員資訊系統</small>
        </span>
      </a>

      <nav class="site-nav">
        <a href="./member.html">
          社員首頁
        </a>

        <a href="./dex.html">
          社員圖鑑
        </a>

        <a
          class="active"
          href="./memories.html"
        >
          回憶牆
        </a>

        <a href="./courses.html">
          社課資訊
        </a>

        <a href="./leaderboard.html">
          排行榜
        </a>

        <button
          id="logoutButton"
          class="site-nav-logout"
          type="button"
        >
          登出
        </button>
      </nav>
    </div>
  </header>

  <main class="leaderboard-page">
    <section class="dex-hero">
      <p class="leaderboard-eyebrow">
        SURF CLUB MEMORIES
      </p>

      <h1>
        回憶牆
      </h1>

      <p class="leaderboard-description">
        每一次出團、每一個第一次、每一句名言，都在這裡。
      </p>

      <div
        id="reviewLinks"
        class="review-links"
      ></div>
    </section>

    <p
      id="memoriesStatus"
      class="status-message"
    >
      正在載入回憶……
    </p>

    <div id="tripTimeline"></div>
  </main>

  <!-- =====================================================
       出團詳細紀錄
       ===================================================== -->

  <dialog
    id="tripDialog"
    class="profile-dialog dex-dialog"
  >
    <button
      id="closeTripDialog"
      class="icon-button dialog-close"
      type="button"
      aria-label="關閉"
    >
      ×
    </button>

    <div id="tripDialogContent"></div>
  </dialog>

  <script
    type="module"
    src="./js/memories.js"
  ></script>
</body>
</html>
