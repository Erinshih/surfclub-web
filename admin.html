<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-v2.png">
  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <title>Surf Club｜管理員後台</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >
</head>

<body>
  <header class="site-header">
    <nav class="navbar">
      <a
        class="brand"
        href="./admin.html"
      >
        SURF CLUB ADMIN
      </a>

      <div class="nav-links">
        <a href="./admin.html">
          管理首頁
        </a>

        <a href="./admin-announcements.html">
          公告管理
        </a>

        <a href="./admin-courses.html">
          社課管理
        </a>

        <a href="./admin-members.html">
          社員管理
        </a>

        <a href="./admin-trips.html">
          出團紀錄
        </a>

        <a href="./leaderboard.html">
          排行榜
        </a>

        <button
          id="logout-button"
          class="button button-small button-secondary"
          type="button"
        >
          登出
        </button>
      </div>
    </nav>
  </header>

  <main class="dashboard">
    <section class="dashboard-header">
      <div>
        <p class="eyebrow">
          ADMIN DASHBOARD
        </p>

        <h1>
          管理員後台
        </h1>
      </div>

      <p
        id="admin-status"
        class="status-message"
      >
        正在驗證管理員身分……
      </p>
    </section>

    <div
      id="admin-content"
      class="hidden"
    >
      <!-- ===============================================
           目前狀況
           =============================================== -->

      <section
        id="dashboard-stats"
        class="dashboard-stats"
        aria-label="目前狀況"
      >
        <p class="empty-state">
          正在統計……
        </p>
      </section>

      <!-- ===============================================
           最近一次出團
           =============================================== -->

      <section
        id="dashboard-trip"
        class="content-card"
      ></section>

      <!-- ===============================================
           快捷入口
           =============================================== -->

      <section class="dashboard-shortcuts">
        <a
          class="dashboard-shortcut"
          href="./admin-members.html"
        >
          <span class="dashboard-shortcut-emoji">👥</span>
          <strong>社員管理</strong>
          <small>審核申請、調整 Level、家系、積分與稱號</small>
        </a>

        <a
          class="dashboard-shortcut"
          href="./admin-trips.html"
        >
          <span class="dashboard-shortcut-emoji">🌊</span>
          <strong>出團紀錄</strong>
          <small>記錄每一團的參加社員、鳥事、名言和照片</small>
        </a>

        <a
          class="dashboard-shortcut"
          href="./admin-announcements.html"
        >
          <span class="dashboard-shortcut-emoji">📢</span>
          <strong>公告管理</strong>
          <small>發布和刪除社員首頁的公告</small>
        </a>

        <a
          class="dashboard-shortcut"
          href="./admin-courses.html"
        >
          <span class="dashboard-shortcut-emoji">📅</span>
          <strong>社課管理</strong>
          <small>新增、編輯和批次匯入社課</small>
        </a>

        <a
          class="dashboard-shortcut"
          href="./leaderboard.html"
        >
          <span class="dashboard-shortcut-emoji">🏆</span>
          <strong>排行榜</strong>
          <small>查看本學期榜單、重新計算統計</small>
        </a>
      </section>
    </div>
  </main>

  <script
    type="module"
    src="./js/admin-dashboard.js"
  ></script>
</body>
</html>
